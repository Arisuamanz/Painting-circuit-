<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paint Race</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1e4d3d; 
            overflow: hidden;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dimensi dan Radius
        let cx, cy, trackRadius, trackWidth;
        let patternCanvas, patternCtx;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            
            trackRadius = Math.min(canvas.width, canvas.height) * 0.42;
            trackWidth = 10; 
            
            createPattern(); 
        }
        window.addEventListener('resize', resizeCanvas);

        // Palet Warna Premium
        const COLORS = {
            bgCenter: '#3f9b7d', 
            bgEdge: '#1a3c2e',   
            circleBg: '#351b30', 
            trackBase: '#2a1627',
            trackShadow: 'rgba(0,0,0,0.5)',
            paint: '#ff5722',    
            player: '#ff5722',
            enemy: '#111217',    
            enemyEye: '#ff003c', 
            text: '#ffffff',
            pattern: 'rgba(0, 0, 0, 0.12)'
        };

        let lastTime = 0; 
        let dt = 0;
        let gameState = 'MENU'; 
        let currentPaintPercentage = 0;
        let pulseTimer = 0; 
        
        // Pembolehubah Tahap (Stage)
        let currentStage = 1;
        
        // Entiti Pemain
        const player = {
            progress: 0, 
            speed: 0.08, 
            jumpOffset: 0, 
            jumpVelocity: 0,
            gravity: 1200, 
            jumpForce: 450, 
            size: 20, 
            isGrounded: true
        };

        // Entiti Lain & Segmen Cat
        let enemies = [];
        let particles = [];
        let paintedSegments = [];

        // Hasilkan corak segi tiga
        function createPattern() {
            patternCanvas = document.createElement('canvas');
            patternCanvas.width = canvas.width;
            patternCanvas.height = canvas.height;
            patternCtx = patternCanvas.getContext('2d');
            
            patternCtx.fillStyle = COLORS.circleBg;
            patternCtx.fillRect(0, 0, patternCanvas.width, patternCanvas.height);
            
            patternCtx.strokeStyle = COLORS.pattern;
            patternCtx.lineWidth = 2;
            
            const gridSize = 35; 
            patternCtx.beginPath();
            for (let x = 0; x < patternCanvas.width; x += gridSize) {
                for (let y = 0; y < patternCanvas.height; y += gridSize) {
                    patternCtx.moveTo(x, y);
                    patternCtx.lineTo(x + gridSize, y + gridSize);
                    patternCtx.moveTo(x + gridSize, y);
                    patternCtx.lineTo(x, y + gridSize);
                }
            }
            patternCtx.stroke();
        }

        resizeCanvas();

        function generateLevel() {
            particles = [];
            paintedSegments = []; 
            currentPaintPercentage = 0;
            enemies = [];
            
            // Generate enemies based on currentStage
            for (let i = 0; i < currentStage; i++) {
                let startProg = 0.25; 
                if (currentStage > 1) {
                    startProg = 0.25 + (i * (0.65 / (currentStage - 1)));
                }

                // Rawak kelajuan musuh antara 0.03 hingga 0.065
                // Memastikan ia tidak akan sama dengan kelajuan pemain (0.08)
                let randomSpeed = 0.03 + (Math.random() * 0.035);

                enemies.push({ 
                    progress: startProg, 
                    speed: randomSpeed, 
                    size: 22 
                });
            }
        }

        function resetGame(nextStage = false) {
            if (nextStage) {
                currentStage++;
            } else {
                currentStage = 1; // Kembali ke Stage 1 jika kalah
            }

            player.progress = 0;
            player.jumpOffset = 0;
            player.jumpVelocity = 0;
            player.isGrounded = true;
            generateLevel();
            gameState = 'PLAYING';
            lastTime = performance.now(); 
        }

        function spawnParticles(x, y) {
            if (player.isGrounded && Math.random() > 0.4) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 60,
                    vy: (Math.random() - 0.5) * 60,
                    life: 1.0,
                    size: Math.random() * 5 + 2,
                    color: Math.random() > 0.3 ? COLORS.paint : '#ff8a50' 
                });
            }
        }

        // Fungsi Tambah & Gabung Segmen Cat
        function addPaintSegment(start, end) {
            start = Math.max(0, Math.min(1, start));
            end = Math.max(0, Math.min(1, end));
            if (start >= end) return;

            paintedSegments.push({ start, end });
            
            paintedSegments.sort((a, b) => a.start - b.start);
            let merged = [paintedSegments[0]];
            
            for (let i = 1; i < paintedSegments.length; i++) {
                let last = merged[merged.length - 1];
                let curr = paintedSegments[i];
                
                if (curr.start <= last.end + 0.005) {
                    last.end = Math.max(last.end, curr.end);
                } else {
                    merged.push(curr);
                }
            }
            paintedSegments = merged;
            
            let totalPainted = paintedSegments.reduce((sum, seg) => sum + (seg.end - seg.start), 0);
            currentPaintPercentage = Math.floor(totalPainted * 100);

            if (totalPainted >= 0.995) {
                currentPaintPercentage = 100;
                gameState = 'WIN';
            }
        }

        function handleInput(e) {
            e.preventDefault();
            if (gameState === 'MENU') {
                resetGame(false);
                return;
            }
            if (gameState === 'GAMEOVER') {
                resetGame(false); // Restart Stage 1
                return;
            }
            if (gameState === 'WIN') {
                resetGame(true); // Naik Stage
                return;
            }

            if (gameState === 'PLAYING' && player.isGrounded) {
                player.jumpVelocity = player.jumpForce;
                player.isGrounded = false;
            }
        }

        function handleInputEnd(e) {
            e.preventDefault();
            if (gameState === 'PLAYING' && !player.isGrounded && player.jumpVelocity > 0) {
                player.jumpVelocity *= 0.4;
            }
        }

        window.addEventListener('touchstart', handleInput, {passive: false});
        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchend', handleInputEnd);
        window.addEventListener('mouseup', handleInputEnd);

        function getCoords(progress, offsetRadius = 0) {
            const angle = -Math.PI / 2 + (progress * Math.PI * 2);
            const r = trackRadius - offsetRadius;
            return {
                x: cx + Math.cos(angle) * r,
                y: cy + Math.sin(angle) * r,
                angle: angle
            };
        }

        function update() {
            pulseTimer += dt;
            if (gameState !== 'PLAYING') return;

            let oldProg = player.progress % 1.0;
            player.progress += player.speed * dt;
            let newProg = player.progress % 1.0;

            if (player.isGrounded) {
                if (newProg < oldProg) {
                    addPaintSegment(oldProg, 1.0);
                    addPaintSegment(0.0, newProg);
                } else {
                    addPaintSegment(oldProg, newProg);
                }
            }

            for (let enemy of enemies) {
                enemy.progress -= enemy.speed * dt;
                if (enemy.progress < 0) enemy.progress += 1.0; 
            }

            if (!player.isGrounded) {
                player.jumpOffset += player.jumpVelocity * dt;
                player.jumpVelocity -= player.gravity * dt;

                if (player.jumpOffset <= 0) {
                    player.jumpOffset = 0;
                    player.jumpVelocity = 0;
                    player.isGrounded = true;
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2.5; 
                if (p.life <= 0) particles.splice(i, 1);
            }

            checkCollisions();
        }

        function checkCollisions() {
            const pCoords = getCoords(player.progress % 1.0, player.jumpOffset);
            spawnParticles(pCoords.x, pCoords.y);

            let pProgModulo = player.progress % 1.0;

            for (let enemy of enemies) {
                let diff = Math.abs(pProgModulo - enemy.progress);
                if (diff > 0.5) diff = 1.0 - diff;

                if (diff < 0.05) {
                    const eCoords = getCoords(enemy.progress, 0);
                    const dist = Math.hypot(pCoords.x - eCoords.x, pCoords.y - eCoords.y);
                    
                    if (dist < (player.size/2) + (enemy.size/2)) {
                        gameState = 'GAMEOVER';
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Latar Belakang Gradient Radial
            let bgGradient = ctx.createRadialGradient(cx, cy, trackRadius * 0.2, cx, cy, Math.max(canvas.width, canvas.height));
            bgGradient.addColorStop(0, COLORS.bgCenter);
            bgGradient.addColorStop(1, COLORS.bgEdge);
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Latar Belakang Bulatan Dalam
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, trackRadius - trackWidth/2, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(patternCanvas, 0, 0);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 10;
            ctx.stroke();
            ctx.restore();

            // 3. Landasan Asas
            ctx.shadowColor = COLORS.trackShadow;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(cx, cy, trackRadius, 0, Math.PI * 2);
            ctx.strokeStyle = COLORS.trackBase;
            ctx.lineWidth = trackWidth;
            ctx.stroke();
            ctx.shadowBlur = 0; 

            // 4. Lukis Cat
            ctx.shadowColor = COLORS.paint;
            ctx.shadowBlur = 10;
            for (let seg of paintedSegments) {
                ctx.beginPath();
                const startAngle = -Math.PI / 2 + (seg.start * Math.PI * 2);
                const endAngle = -Math.PI / 2 + (seg.end * Math.PI * 2);
                ctx.arc(cx, cy, trackRadius, startAngle, endAngle);
                ctx.strokeStyle = COLORS.paint;
                ctx.lineWidth = trackWidth + 2; 
                ctx.lineCap = 'round'; 
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // 5. Zarah
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 6. Musuh
            for (let enemy of enemies) {
                const eCoords = getCoords(enemy.progress, 0);
                ctx.save();
                ctx.translate(eCoords.x, eCoords.y);
                ctx.rotate(eCoords.angle);
                
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.fillStyle = COLORS.enemy;
                ctx.beginPath();
                ctx.roundRect(-enemy.size/2, -enemy.size/2, enemy.size, enemy.size, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.shadowColor = COLORS.enemyEye;
                ctx.shadowBlur = 8;
                ctx.fillStyle = COLORS.enemyEye; 
                ctx.beginPath(); ctx.arc(-3, -5, 4, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(-4, -5, 1.5, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            }

            // 7. Pemain
            const pProgModulo = player.progress % 1.0;
            const pCoords = getCoords(pProgModulo, player.jumpOffset);
            ctx.save();
            ctx.translate(pCoords.x, pCoords.y);
            ctx.rotate(pCoords.angle);

            ctx.shadowColor = COLORS.player;
            ctx.shadowBlur = 15;
            ctx.fillStyle = COLORS.player;
            
            let scaleY = 1;
            if (!player.isGrounded) scaleY = 1 + (Math.abs(player.jumpVelocity) / 2000); 
            ctx.scale(1 / scaleY, scaleY);
            
            ctx.beginPath();
            ctx.roundRect(-player.size/2, -player.size/2, player.size, player.size, 6);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(4, -4, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, 4, 3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(5, -4, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, 4, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            drawUI();
        }

        function drawUI() {
            const percentage = Math.floor(player.progress * 100);
            let pulse = Math.abs(Math.sin(pulseTimer * 3));

            if (gameState === 'PLAYING' || gameState === 'WIN' || gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.arc(cx, cy, 60, 0, Math.PI*2);
                ctx.fill();

                // Paparkan Teks Stage di atas peratusan
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = 'bold 16px Montserrat, Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`STAGE ${currentStage}`, cx, cy - 25);

                ctx.fillStyle = COLORS.text;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.font = '900 42px Montserrat, Arial';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${currentPaintPercentage}%`, cx, cy + 10);
                ctx.shadowBlur = 0;
            }

            if (gameState === 'MENU') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = COLORS.text;
                ctx.shadowColor = COLORS.paint;
                ctx.shadowBlur = 15 * pulse;
                ctx.font = 'bold 48px Montserrat';
                ctx.textAlign = 'center';
                ctx.fillText('PAINT RACE', cx, cy - 60);
                ctx.shadowBlur = 0;
                
                ctx.font = '20px Montserrat';
                ctx.fillText('Tap to Jump Inside', cx, cy + 20);
                ctx.fillText('Fill 100% Paint to WIN!', cx, cy + 50);
                
                ctx.globalAlpha = 0.5 + pulse * 0.5;
                ctx.fillStyle = COLORS.paint;
                ctx.fillText('TAP TO START', cx, cy + 120);
                ctx.globalAlpha = 1.0;
            } 
            else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 48px Montserrat';
                ctx.textAlign = 'center';
                ctx.fillText('CRASHED!', cx, cy - 60);
                
                ctx.fillStyle = COLORS.text;
                ctx.font = '24px Montserrat';
                ctx.fillText(`Failed at Stage ${currentStage}`, cx, cy + 10);
                
                ctx.globalAlpha = 0.5 + pulse * 0.5;
                ctx.fillStyle = COLORS.paint;
                ctx.font = '20px Montserrat';
                ctx.fillText('TAP TO RESTART STAGE 1', cx, cy + 100);
                ctx.globalAlpha = 1.0;
            }
            else if (gameState === 'WIN') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 15 * pulse;
                ctx.font = 'bold 48px Montserrat';
                ctx.textAlign = 'center';
                ctx.fillText('CLEARED!', cx, cy - 60);
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = COLORS.text;
                ctx.font = '24px Montserrat';
                ctx.fillText(`Stage ${currentStage} Complete!`, cx, cy + 10);
                
                ctx.globalAlpha = 0.5 + pulse * 0.5;
                ctx.fillStyle = COLORS.paint;
                ctx.font = '20px Montserrat';
                ctx.fillText('TAP FOR NEXT STAGE', cx, cy + 100);
                ctx.globalAlpha = 1.0;
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp; 
            dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (dt < 0) dt = 0; 
            if (dt > 0.1) dt = 0.1;

            update();
            draw();

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

    </script>
</body>
</html>
